function Crowd({ running, done, onDone, reduced }) {
  const [n, setN] = useState(0);
  const started = useRef(false);
  useEffect(() => {
    if (!running || started.current) return;
    started.current = true;
    if (reduced) { setN(200); onDone(); return; }
    const t = setInterval(() => {
      setN((v) => {
        if (v >= 200) { clearInterval(t); onDone(); return 200; }
        return v + 4;
      });
    }, 34);
    return () => clearInterval(t);
  }, [running, reduced, onDone]);
  const shown = done ? 200 : n;
  return (
    <div className="border border-stone-300 bg-white">
      <div className="px-5 py-3 border-b border-stone-200 flex items-baseline justify-between">
        <Label className="text-stone-500">Din beet rahe hain</Label>
        <span className="font-bold text-2xl text-amber-700 tabular-nums">{shown}</span>
      </div>
      <div className="px-5 py-5">
        <div className="flex flex-wrap gap-1" aria-hidden="true">
          {Array.from({ length: 40 }).map((_, i) => (
            <span key={i} className="w-2.5 h-5 rounded-sm"
              style={{ backgroundColor: i < Math.floor(shown / 5) ? "#1c1917" : "#e7e5e4" }} />
          ))}
        </div>
        <p className="mt-4 text-sm text-stone-600 leading-relaxed" style={{ textWrap: "pretty" }}>
          Itne log aapke baad aaye. Sabne kuch na kuch bola. Purane Ramu ke dimaag mein aapki baat
          sabse neeche dab gayi — <span className="text-stone-900 font-semibold">mitayi nahi, bas dab gayi.</span>
        </p>
      </div>
    </div>
  );
}

  const [step, setStep] = useState("say");
  const [guess, setGuess] = useState(null);
  const [right, setRight] = useState(0);
  const [diary, setDiary] = useState([]);
  const [open, setOpen] = useState(false);
  const reduced = useRef(typeof window !== "undefined" && window.matchMedia
    && window.matchMedia("(prefers-reduced-motion: reduce)").matches).current;

  const fin = screen === "finance";
  const r = fin ? FINANCE : ROUNDS[ri];

  const start = () => { setScreen("play"); setRi(0); setStep("say"); setGuess(null); setRight(0); setDiary([]); };

  const said = () => { setStep("rush"); };
  const rushDone = () => setTimeout(() => setStep("guess"), 400);
  const doGuess = (g) => {
    setGuess(g);
    if (g === true) setRight((x) => x + 1);
    setTimeout(() => setStep("serve"), 600);
  };
  const serve = () => {
    setDiary((d) => [...d, { kind: fin ? "Paisa — shart aur goal" : r.kind, note: r.note }]);
    setStep("why");
  };
  const next = () => {
    if (fin) { setScreen("end"); return; }
    if (ri + 1 >= ROUNDS.length) { setScreen("finance"); setStep("say"); setGuess(null); return; }
    setRi(ri + 1); setStep("say"); setGuess(null);
  };

  useEffect(() => {
    const h = (e) => {
      if (e.key === "Escape") setOpen(false);
      if (e.key === "Enter") {
        if (screen === "intro") start();
        else if (step === "say") said();
        else if (step === "serve") serve();
        else if (step === "why") next();
      }

    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });

  /* ---------------------------------------------------- intro */

            <Label className="text-stone-500">Ek chai ki dukaan, aur do dukaandaar</Label>
          </div>
          <h1 className="text-5xl md:text-7xl font-bold tracking-tight mt-5 leading-[1.02] text-balance">
            Ramu ki chai tapri
          </h1>

            aapke baad <span className="font-semibold text-stone-900">200 aur log</span> aate hain, aur
            sabki apni farmaish hai.
          </p>
          <p className="mt-4 text-lg text-stone-700 leading-relaxed max-w-prose" style={{ textWrap: "pretty" }}>
            Is tapri pe do Ramu khade hain. Dono aapki baat sunte hain. Ek bhool jaata hai,
            doosra diary rakhta hai. Aapko kuch seekhna nahi — bas dekhna hai ki cup mein kya aaya.
          </p>

          <div className="mt-12 grid sm:grid-cols-2 gap-px bg-stone-300 border border-stone-300">
            <div className="bg-white p-6">
              <div className="flex items-center gap-2"><i className="fa-solid fa-user text-stone-500" aria-hidden="true" />
                <Label className="text-stone-500">Purana Ramu</Label></div>
              <p className="mt-3 text-sm text-stone-700 leading-relaxed">
                Sab kuch ek dher mein daal deta hai. Jo baat zyada baar suni, wahi uske liye sach hai.
                Aajkal ke zyadatar AI assistant aise hi chalte hain.
              </p>
            </div>
            <div className="bg-white p-6">
              <div className="flex items-center gap-2"><i className="fa-solid fa-book text-amber-700" aria-hidden="true" />

              <p className="mt-3 text-sm text-stone-700 leading-relaxed">

              </p>

            <p className="text-stone-700 leading-relaxed">

        </div>
      </div>

              Jab panna milta hai to Ramu dher mein dhoondhta nahi — seedha kholta hai. Isiliye
              bheed badhne se diary kamzor nahi hoti. Aur purani baat kabhi mitayi nahi jaati, sirf
              kaati jaati hai — taaki ye bhi pata rahe ki kab aur kya badla tha.
            </p>
          </div>

          <button onClick={start}
            className="mt-10 bg-stone-900 text-amber-50 px-7 py-4 text-base font-semibold rounded-sm hover:bg-stone-800 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700">
            Dobara khelo
          </button>
        </div>
      </div>
    );
  }

  /* ---------------------------------------------------- play */
  const n = fin ? 7 : ri + 1;
  return (
    <div className="min-h-screen bg-amber-50 text-stone-900 font-display">
      <header className="border-b border-stone-300 bg-amber-50 sticky top-0 z-20">
        <div className="max-w-5xl mx-auto px-5 py-3 flex items-center gap-4">
          <div className="flex items-center gap-2 mr-auto">
            <i className={"fa-solid " + (fin ? "fa-indian-rupee-sign" : "fa-mug-hot") + " text-amber-700"} aria-hidden="true" />
            <span className="font-bold tracking-tight">{fin ? "Wahi kahani, alag dukaan" : "Ramu ki chai tapri"}</span>
          </div>
          <div className="flex gap-1" aria-label={"Order " + n + " of 7"}>
            {Array.from({ length: 7 }).map((_, i) => (
              <span key={i} className={"w-6 h-1.5 rounded-sm " + (i < n - 1 ? "bg-amber-700" : i === n - 1 ? "bg-stone-900" : "bg-stone-300")} />
            ))}
          </div>
          <button onClick={() => setOpen(true)} disabled={!diary.length}
            className="text-xs uppercase tracking-widest text-amber-700 disabled:text-stone-400 hover:underline focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700">
            Diary ({diary.length})
          </button>
        </div>
      </header>

      <main className="max-w-5xl mx-auto px-5 py-10 grid lg:grid-cols-12 gap-10">
        {/* left: the conversation */}
        <div className="lg:col-span-5">
          <Label className="text-stone-500">{r.day}</Label>
          <h1 className="text-3xl md:text-4xl font-bold tracking-tight mt-2 leading-tight text-balance">
            {fin ? "Ab chai ki jagah paisa" : r.kind}
          </h1>

          <div className="mt-7 border-l-2 border-stone-900 pl-5 py-1">
            <Label className="text-stone-500">Aap bolte ho</Label>
            <p className="mt-2 text-xl leading-snug">“{r.say}”</p>
          </div>

          {step !== "say" && (
            <div className="mt-6 border-l-2 border-amber-700 pl-5 py-1">
              <Label className="text-amber-700">{fin ? "200 messages baad" : "200 customers baad, aap bolte ho"}</Label>
              <p className="mt-2 text-xl leading-snug">“{r.ask}”</p>
            </div>
          )}

          {step === "say" && (
            <button onClick={said}
              className="mt-8 w-full sm:w-auto bg-stone-900 text-amber-50 px-6 py-3.5 text-sm font-semibold rounded-sm hover:bg-stone-800 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700">
              Bol diya — ab din beetne do
            </button>
          )}

          {step === "guess" && (
            <div className="mt-8 border border-stone-300 bg-white p-5 rounded-sm">
              <Label className="text-stone-500">Ek andaza lagao</Label>
              <p className="mt-2 text-lg leading-snug">{r.guessQ || FINANCE.guessQ}</p>
              <div className="mt-4 inline-flex border border-stone-900 divide-x divide-stone-900 rounded-sm overflow-hidden">
                <button onClick={() => doGuess(true)}
                  className={"px-6 py-2.5 text-sm font-semibold transition-colors " + (guess === true ? "bg-stone-900 text-amber-50" : "bg-white hover:bg-stone-100")}>
                  Haan, phasega
                </button>
                <button onClick={() => doGuess(false)}
                  className={"px-6 py-2.5 text-sm font-semibold transition-colors " + (guess === false ? "bg-stone-900 text-amber-50" : "bg-white hover:bg-stone-100")}>
                  Nahi, yaad rahega
                </button>
              </div>
            </div>
          )}

          {(step === "serve" || step === "why") && (
            <div className="mt-8 border border-stone-300 bg-white p-5 rounded-sm">
              <Label className={guess ? "text-amber-700" : "text-red-700"}>
                {guess ? "Aapka andaza sahi tha" : "Aapka andaza galat tha"}
              </Label>
              <p className="mt-2 text-sm text-stone-700 leading-relaxed">
                {guess ? "Haan — wo phasa. Dekhiye kaise." : "Wo phas gaya. Dekhiye kaise."}
              </p>
            </div>
          )}

          {step === "why" && (
            <div className="mt-6 space-y-5">
              <div className="border-l-2 border-red-700 pl-5">
                <Label className="text-red-700">Nuksaan</Label>
                <p className="mt-1.5 text-lg font-semibold leading-snug">{r.cost}</p>
              </div>
              <div>
                <Label className="text-stone-500">Hua kya</Label>
                <p className="mt-2 text-stone-700 leading-relaxed" style={{ textWrap: "pretty" }}>{r.why}</p>
              </div>
              <div className="border border-amber-700 bg-white p-5 rounded-sm">
                <div className="flex items-center gap-2">
                  <i className="fa-solid fa-book text-amber-700" aria-hidden="true" />
                  <Label className="text-amber-700">Diary mein naya panna</Label>
                </div>
                <p className="mt-3 text-sm text-stone-900 leading-relaxed">{r.note}</p>
              </div>
              <button onClick={next}
                className="w-full sm:w-auto bg-stone-900 text-amber-50 px-6 py-3.5 text-sm font-semibold rounded-sm hover:bg-stone-800 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700">
                {fin ? "Dukaan band karo" : ri + 1 >= ROUNDS.length ? "Aakhri order — ye chai ka nahi hai" : "Agla din"}
              </button>
            </div>
          )}
        </div>

        {/* right: the counter */}
        <div className="lg:col-span-7">
          {step === "say" && (
            <div className="border border-dashed border-stone-300 bg-white h-full min-h-60 flex items-center justify-center p-10">
              <div className="text-center max-w-xs">
                <i className="fa-solid fa-mug-hot text-4xl text-stone-300" aria-hidden="true" />
                <p className="mt-4 text-sm text-stone-500 leading-relaxed">
                  Dono Ramu ne sun liya. Dono ne sir hilaya. Ab dekhte hain kaun yaad rakhta hai.
                </p>
              </div>
            </div>
          )}

          {step === "rush" && <Crowd running done={false} onDone={rushDone} reduced={reduced} />}
          {step === "guess" && <Crowd running done onDone={() => {}} reduced />}

          {(step === "serve" || step === "why") && (
            <div>
              <div className="flex items-baseline justify-between border-b border-stone-300 pb-2 mb-5">
                <Label className="text-stone-500">{fin ? "Do salah" : "Do cup"}</Label>
                <Label className="text-stone-400">same order, same din</Label>
              </div>
              <div className="grid sm:grid-cols-2 gap-5">
                <CupPanel title="Purana Ramu" sub={fin ? "Normal bot" : "Sab ek dher mein"} bad
                  items={r.old} says={r.oldSays} big={ri === 4 && !fin} finance={fin} />
                <CupPanel title="Diary wala Ramu" sub="TAMS" items={r.tams} says={r.tamsSays}
                  big={ri === 4 && !fin} finance={fin} />
              </div>
              {step === "serve" && (
                <button onClick={serve}
                  className="mt-6 w-full bg-amber-700 text-amber-50 px-6 py-3.5 text-sm font-semibold rounded-sm hover:bg-amber-800 transition-colors focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-stone-900">
                  Ramu se poochho — aapko kaise yaad raha?
                </button>
              )}
            </div>
          )}
        </div>
      </main>

      {/* diary drawer */}
      {open && (
        <div className="fixed inset-0 z-40 bg-stone-900 bg-opacity-50 flex justify-end" onClick={() => setOpen(false)}>
          <div className="bg-amber-50 w-full max-w-md h-full overflow-y-auto" onClick={(e) => e.stopPropagation()}>
            <div className="px-6 py-5 border-b border-stone-300 flex items-center justify-between sticky top-0 bg-amber-50">
              <div className="flex items-center gap-2">
                <i className="fa-solid fa-book text-amber-700" aria-hidden="true" />
                <span className="font-bold tracking-tight">Ramu ki diary</span>
              </div>
              <button onClick={() => setOpen(false)} aria-label="Band karo"
                className="text-stone-500 hover:text-stone-900 focus-visible:outline focus-visible:outline-2 focus-visible:outline-amber-700">
                <i className="fa-solid fa-xmark text-lg" aria-hidden="true" />
              </button>
            </div>
            <div className="divide-y divide-stone-300 border-b border-stone-300">
              {diary.map((d, i) => (
                <div key={i} className="px-6 py-4">
                  <Label className="text-amber-700">{d.kind}</Label>
                  <p className="mt-2 text-sm text-stone-800 leading-relaxed">{d.note}</p>
                </div>
              ))}
            </div>
            <p className="px-6 py-5 text-xs text-stone-500 leading-relaxed">
              Har panne pe naam, wajah aur tareekh hai. Purani baatein kaati hui hain, mitayi nahi.
            </p>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
