[project]
name = "tams"
version = "0.2.0"
description = "TAMS v2 — Tiered Agent Memory System with Lossless Fact Extraction"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "tiktoken>=0.7.0",
    "redis>=5.0.0",
    "qdrant-client>=1.9.0",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "tenacity>=8.3.0",
    "python-dateutil>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "fakeredis>=2.23.0",
]

[project.scripts]
tams = "tams.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tams*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
